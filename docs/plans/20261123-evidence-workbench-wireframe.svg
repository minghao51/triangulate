<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Triangulate evidence workbench: proposed desktop wireframe</title>
  <desc id="wf-desc">Low-fidelity 1280 by 800 wireframe with seven numbered regions: primary navigation, case-scoped search, case identity and coverage status, case tabs, claim with linked sources, immutable capture inspector, and provenance and dependency context. Proposal only, not shipped. All cases, IDs, quotes and domains are synthetic.</desc>
