    <text x="32" y="328" font-size="12" fill="#000">case-2199-1180</text>
    <text x="32" y="352" font-size="12" fill="#000">case-2198-0922</text>
    <text x="32" y="400" font-size="12" font-weight="600" fill="#000">READ-ONLY BY DEFAULT</text>
    <text x="32" y="424" font-size="12" fill="#000">GET requests only</text>
    <text x="32" y="448" font-size="12" fill="#000">local / trusted</text>
