<!-- viewport: 375×812 mobile -->
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Report — download error — mobile</title>
  <desc id="wf-desc">Report — download error — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — all seven destinations remain reachable; CLI owns ingest; 2 Report — download error header — title, synthetic context and available actions; 3 Download error — explicit failure, no empty document rendered. · frame 1 of 1; 4 Artifact note — the run-specific directory and stored formats. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
    <rect x="0" y="0" width="368" height="808" fill="#fff"/>
    <rect x="8" y="8" width="352" height="792" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="16" y="32" width="328" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <rect x="264" y="40" width="64" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="296" y="56" text-anchor="middle" font-size="12" fill="#000">Menu</text>
    <rect x="16" y="104" width="328" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="144" font-size="14" fill="#000" font-weight="600">Report — download error</text>
    <text x="32" y="168" font-size="12" fill="#666">Proposal · synthetic · not built</text>
    <g data-pane="p1">
    <rect x="16" y="208" width="328" height="224" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="248" font-size="14" fill="#000" font-weight="600">Download failed</text>
    <rect x="32" y="256" width="296" height="120" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="288" font-size="14" fill="#000" font-weight="600">The stored report file could…</text>
    <text x="48" y="312" font-size="12" fill="#666">No partial file is served</text>
    <text x="48" y="336" font-size="12" fill="#666">Nested status page is refused</text>
    <rect x="32" y="384" width="96" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="40" y="408" font-size="12" fill="#000">Retry</text>
    </g>
    <g data-pane="p2">
    <rect x="16" y="456" width="328" height="112" fill="#fff" stroke="#000" stroke-width="1.5"/>
