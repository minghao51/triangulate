    <text x="32" y="520" font-size="12" fill="#000">run-0007 · reports/run-0007/</text>
    <text x="32" y="544" font-size="12" fill="#000">Markdown stored · Raw JSON stored</text>
    </g>
    <g data-pane="p3">
    <rect x="16" y="592" width="328" height="112" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="632" font-size="14" fill="#000" font-weight="600">What this is not</text>
    <text x="32" y="656" font-size="12" fill="#666">Failed download is not an empty report</text>
    <text x="32" y="680" font-size="12" fill="#666">No regeneration on GET</text>
    </g>
  </g>
