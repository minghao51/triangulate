<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Report — desktop</title>
  <desc id="wf-desc">Report — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Report header — title, synthetic context and available actions; 3 Case tabs (12) — active Report; tabs are navigation, not state changes; 4 Report pane — document preview plus Markdown/JSON downloads; a missing artifact keeps its control disabled. · frame 1 of 1; 5 Report facts — run-specific paths and formats; the report is stored, not regenerated on read. · frame 1 of 1; 6 Historical reports — report documents bind to their run and snapshot. · frame 1 of 1.</desc>
