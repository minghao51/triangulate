<!-- viewport: 375×812 mobile -->
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Pipeline monitor — mobile</title>
  <desc id="wf-desc">Pipeline monitor — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Pipeline monitor header — title, synthetic context and available actions; 3 Configured stages — configuration order and enabled flag; configuration is not an attempt. · frame 1 of 2.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
    <rect x="0" y="0" width="368" height="808" fill="#fff"/>
    <rect x="8" y="8" width="352" height="792" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="16" y="32" width="328" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <rect x="264" y="40" width="64" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="296" y="56" text-anchor="middle" font-size="12" fill="#000">Menu</text>
    <rect x="16" y="104" width="328" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="144" font-size="14" fill="#000" font-weight="600">Pipeline monitor</text>
    <text x="32" y="168" font-size="12" fill="#666">Configured stages vs recorded attempts…</text>
    <g data-pane="p1">
    <rect x="16" y="208" width="328" height="416" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="248" font-size="14" fill="#000" font-weight="600">Configured stages</text>
    <text x="32" y="280" font-size="14" fill="#000">extraction</text>
    <text x="32" y="304" font-size="12" fill="#666">Order: 1</text>
    <text x="32" y="328" font-size="12" fill="#666">Enabled: yes</text>
    <line x1="32" y1="336" x2="328" y2="336" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="368" font-size="14" fill="#000">party_classifier</text>
    <text x="32" y="392" font-size="12" fill="#666">Order: 2</text>
    <text x="32" y="416" font-size="12" fill="#666">Enabled: yes</text>
    <line x1="32" y1="424" x2="328" y2="424" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="456" font-size="14" fill="#000">party_investigators</text>
    <text x="32" y="480" font-size="12" fill="#666">Order: 3</text>
    <text x="32" y="504" font-size="12" fill="#666">Enabled: yes</text>
    <line x1="32" y1="512" x2="328" y2="512" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="544" font-size="14" fill="#000">arbiter</text>
    <text x="32" y="568" font-size="12" fill="#666">Order: 4</text>
    <text x="32" y="592" font-size="12" fill="#666">Enabled: yes</text>
    <line x1="32" y1="600" x2="328" y2="600" stroke="#000" stroke-width="1.5"/>
    </g>
  </g>
  <g id="annotations" font-family="-apple-system, system-ui, sans-serif">
    <rect data-region="1" x="8" y="24" width="344" height="64" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
    <rect data-region="2" x="8" y="96" width="344" height="96" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
    <rect data-region="3" x="8" y="200" width="344" height="432" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
