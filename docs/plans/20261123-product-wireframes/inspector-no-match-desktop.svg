<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Inspector — quotation not in scope — desktop</title>
  <desc id="wf-desc">Inspector — quotation not in scope — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Inspector — quotation not in scope header — title, synthetic context and available actions; 3 No-match state — no highlight and no scope widening on read. · frame 1 of 1; 4 Recorded scope — the reader does not search outside the recorded scope. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
