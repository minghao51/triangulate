  <title id="wf-title">Not found — unknown case or tab — desktop</title>
  <desc id="wf-desc">Not found — unknown case or tab — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Not found — unknown case or tab header — title, synthetic context and available actions; 3 404 state — unknown case id or unknown tab route; no substitution. · frame 1 of 1; 4 State scope note — what the state does and does not assert. · frame 1 of 1; 5 Deep-link note — selection parameters never fall back to another item. · frame 1 of 1.</desc>
