  <title id="wf-title">Inspector — legacy snapshot — tablet</title>
  <desc id="wf-desc">Inspector — legacy snapshot — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Inspector — legacy snapshot header — title, synthetic context and available actions; 3 Legacy capture — imported text is labelled legacy_snapshot with unknown observation time. · frame 1 of 1; 4 State scope note — what the state does and does not assert. · frame 1 of 1; 5 Legacy quotation note — imported text never gains validated offsets by reading. · frame 1 of 1.</desc>
