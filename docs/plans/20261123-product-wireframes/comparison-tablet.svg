  <title id="wf-title">Comparison — tablet</title>
  <desc id="wf-desc">Comparison — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Comparison header — title, synthetic context and available actions; 3 Case tabs (12) — active Compare; tabs are navigation, not state changes; 4 Selection controls — four visible fields (left/right source and capture) plus Compare, Swap and Clear; selections stay in the URL. · frame 1 of 2; 5 Left source panel — its own capture time, hash and Open passage navigation. · frame 1 of 2; 6 Right source panel — its own capture time, hash and Open passage navigation; desktop side by side, tablet and mobile stack. · frame 1 of 2.</desc>
