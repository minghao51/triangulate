    <text x="48" y="768" font-size="12" fill="#666">Live case no longer contains this claim</text>
    <text x="48" y="792" font-size="12" fill="#666">Not a retraction or a truth determination</text>
    <text x="48" y="816" font-size="12" fill="#666">Historical claim stays inspectable</text>
    </g>
  </g>
