    <rect x="48" y="448" width="672" height="64" fill="#e6e6e6"/>
    <text x="56" y="472" font-size="12" fill="#000">claim-8897 · budget line was recorded in this snapshot and does not resolve to the live</text>
    <text x="56" y="496" font-size="12" fill="#000">claim row.</text>
    </g>
    <g data-pane="p3">
    <rect x="32" y="544" width="704" height="136" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="584" font-size="14" fill="#000" font-weight="600">Immutable passage</text>
    <text x="48" y="608" font-size="12" fill="#000">citation-3308 · cap-9a11</text>
    <text x="48" y="632" font-size="12" fill="#000">Quotation range: synthetic placeholder</text>
    <text x="48" y="656" font-size="12" fill="#000">Source: Wire Desk (synthetic) · observed 2026-11-18</text>
    </g>
