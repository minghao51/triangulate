<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Historical snapshot — tablet</title>
  <desc id="wf-desc">Historical snapshot — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Historical snapshot header — title, synthetic context and available actions; 3 Snapshot metadata — frozen identifiers, versions and creation time. · frame 1 of 1; 4 Frozen claim — claim text from the baseline snapshot, retrieved by immutable reference. · frame 1 of 1; 5 Immutable passage — frozen quotation range and its capture; no latest-capture substitution. · frame 1 of 1; 6 Live-state note — distinguishes gone/rewritten from unchanged without attribution. · frame 1 of 1.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
    <rect x="0" y="0" width="768" height="1024" fill="#fff"/>
    <rect x="8" y="8" width="752" height="1008" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="32" y="32" width="704" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <text x="168" y="56" font-size="12" fill="#000">Dashboard</text>
    <text x="248" y="56" font-size="12" fill="#000" font-weight="600">Cases</text>
    <text x="304" y="56" font-size="12" fill="#000">Monitoring</text>
    <text x="392" y="56" font-size="12" fill="#000">AI info</text>
    <rect x="32" y="104" width="704" height="88" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="152" font-size="20" fill="#000" font-weight="600">Historical snapshot</text>
    <text x="48" y="176" font-size="12" fill="#666">Reads the stored snapshot, never the latest row · Proposal · synthetic · not built</text>
    <g data-pane="p1">
    <rect x="32" y="216" width="704" height="160" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="256" font-size="14" fill="#000" font-weight="600">Snapshot</text>
    <text x="48" y="280" font-size="12" fill="#000">snapshot-s002 · case-2201-0417</text>
    <text x="48" y="304" font-size="12" fill="#000">run-0006 · succeeded · complete scope</text>
    <text x="48" y="328" font-size="12" fill="#000">schema v3 · identity v1 · policy v1</text>
    <text x="48" y="352" font-size="12" fill="#000">Created 2026-11-19 · immutable</text>
    </g>
    <g data-pane="p2">
