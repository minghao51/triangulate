<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Dashboard — case portfolio — desktop</title>
  <desc id="wf-desc">Dashboard — case portfolio — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Dashboard — case portfolio header — title, synthetic context and available actions; 3 Case portfolio — observed status and acquisition coverage per case, not a truth score. · frame 1 of 1; 4 Observed totals — row counts only; no confidence, health or trend claim. · frame 1 of 1; 5 Recent grouped runs — recorded status and coverage across cases. · frame 1 of 1; 6 Navigation entry points — monitoring and AI info are readers, not control planes. · frame 1 of 1.</desc>
