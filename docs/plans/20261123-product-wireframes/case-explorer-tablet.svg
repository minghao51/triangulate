<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Case explorer — tablet</title>
  <desc id="wf-desc">Case explorer — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Case explorer header — title, synthetic context and available actions; 3 Case filters — literal query, status and sort; no hidden full-text index is claimed. · frame 1 of 1; 4 Case table — per-case observed status, coverage and update time. · frame 1 of 1; 5 Pagination — disabled Previous on the first page; no synthetic totals. · frame 1 of 1.</desc>
