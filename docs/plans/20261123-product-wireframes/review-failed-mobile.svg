    <text x="48" y="312" font-size="12" fill="#666">Another case-bound writer holds th…</text>
    <text x="48" y="336" font-size="12" fill="#666">Decision not saved · entered notes…</text>
    <rect x="32" y="384" width="120" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="40" y="408" font-size="12" fill="#000">Refresh case</text>
    </g>
    <g data-pane="p2">
