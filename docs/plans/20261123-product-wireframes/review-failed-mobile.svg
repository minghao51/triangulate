    <text x="32" y="544" font-size="12" fill="#666">No success wording</text>
    <text x="32" y="568" font-size="12" fill="#666">Refresh rereads the case</text>
    </g>
    <g data-pane="p3">
    <rect x="16" y="616" width="328" height="160" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="656" font-size="14" fill="#000" font-weight="600">Recovery</text>
    <text x="32" y="680" font-size="12" fill="#000">Wait for writer release, then retry</text>
    <text x="32" y="704" font-size="12" fill="#000">chosen review action</text>
    <text x="32" y="728" font-size="12" fill="#000">Browser review retry uses its narrow</text>
    <text x="32" y="752" font-size="12" fill="#000">POST; CLI recovery is separate</text>
