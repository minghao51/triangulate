<!-- viewport: 375×812 mobile -->
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Review — writer conflict — mobile</title>
  <desc id="wf-desc">Review — writer conflict — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — all seven destinations remain reachable; CLI owns ingest; 2 Review — writer conflict header — title, synthetic context and available actions; 3 409 conflict — active case writer conflict; the decision is explicitly not saved. · frame 1 of 1; 4 State scope note — what the state does and does not assert. · frame 1 of 1; 5 Recovery note — retry the chosen review action after writer release; browser review retry and CLI recovery are separate. · frame 1 of 1.</desc>
