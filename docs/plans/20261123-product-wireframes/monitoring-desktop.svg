<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Monitoring — desktop</title>
  <desc id="wf-desc">Monitoring — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Monitoring header — title, synthetic context and available actions; 3 Recorded checks — stored observation time and status only; no health, scheduler or alert state. · frame 1 of 1; 4 Scope note — monitoring is a recorded-status reader, not an operations dashboard. · frame 1 of 1.</desc>
