    <rect x="0" y="0" width="1280" height="800" fill="#fff"/>
    <rect x="8" y="8" width="1264" height="784" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="32" y="32" width="240" height="744" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <text x="48" y="80" font-size="12" fill="#666">Evidence workbench · proposal</text>
    <line x1="48" y1="88" x2="256" y2="88" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="128" font-size="12" fill="#000" font-weight="600">NAVIGATE</text>
    <text x="48" y="160" font-size="14" fill="#000">Dashboard</text>
    <text x="48" y="192" font-size="14" fill="#000">Cases</text>
    <text x="48" y="224" font-size="14" fill="#000" font-weight="600">Monitoring</text>
    <text x="48" y="256" font-size="14" fill="#000">AI info</text>
    <line x1="48" y1="272" x2="256" y2="272" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="312" font-size="12" fill="#000" font-weight="600">RECENT CASES</text>
    <text x="48" y="336" font-size="12" fill="#000">case-2201-0417</text>
    <text x="48" y="360" font-size="12" fill="#000">case-2199-1180</text>
    <text x="48" y="384" font-size="12" fill="#000">case-2198-0922</text>
    <line x1="48" y1="400" x2="256" y2="400" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="440" font-size="12" fill="#000" font-weight="600">READ-ONLY BY DEFAULT</text>
    <text x="48" y="464" font-size="12" fill="#000">GET reads only</text>
    <text x="48" y="488" font-size="12" fill="#666">local / trusted</text>
    <text x="48" y="512" font-size="12" fill="#666">ingest + runs via CLI</text>
    <text x="48" y="760" font-size="12" fill="#666">Wireframe · synthetic data</text>
    <rect x="296" y="32" width="960" height="88" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="312" y="80" font-size="20" fill="#000" font-weight="600">Monitoring</text>
    <text x="312" y="104" font-size="12" fill="#666">Recorded status and times only · Proposal · synthetic · not built</text>
    <g data-pane="p1">
    <rect x="296" y="144" width="960" height="216" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="312" y="184" font-size="14" fill="#000" font-weight="600">Recorded checks</text>
    <text x="312" y="208" font-size="12" fill="#000" font-weight="600">Case</text>
    <text x="568" y="208" font-size="12" fill="#000" font-weight="600">Last observed</text>
    <text x="824" y="208" font-size="12" fill="#000" font-weight="600">Status</text>
    <text x="992" y="208" font-size="12" fill="#000" font-weight="600">Next run</text>
    <line x1="312" y1="216" x2="1240" y2="216" stroke="#000" stroke-width="1.5"/>
    <text x="312" y="248" font-size="12" fill="#000">case-2201-0417</text>
