<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Source provenance — desktop</title>
  <desc id="wf-desc">Source provenance — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Source provenance header — title, synthetic context and available actions; 3 Case tabs (12) — active Evidence; tabs are navigation, not state changes; 4 Dependency groups — connected components with method and status; a singleton group has no detected edge. · frame 1 of 1; 5 Group detail — the copy edge is labelled dependency_detected and explicitly not independent; groups without an edge stay unknown. · frame 1 of 1; 6 Coverage limits — v1 detection scope, disclosed rather than implied. · frame 1 of 1.</desc>
