  <desc id="wf-desc">This page is beyond the last result — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 This page is beyond the last result header — title, synthetic context and available actions; 3 Paging controls — a valid offset past the last row with the query preserved; Return first page clears offset and keeps the query. · frame 1 of 1; 4 Beyond-last-page state — a valid empty page, not a 422 and not an unavailable index. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
