  <title id="wf-title">Exception queue — desktop</title>
  <desc id="wf-desc">Exception queue — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Exception queue header — title, synthetic context and available actions; 3 Case tabs (12) — active Exceptions; tabs are navigation, not state changes; 4 Exception table — pending disables all row actions; an open row enables Resolve/Defer, a closed row enables Reopen. · frame 1 of 1; 5 Exception actions — the pending row disables Resolve, Defer and Reopen; open and closed rows enable their listed actions. · frame 1 of 1.</desc>
