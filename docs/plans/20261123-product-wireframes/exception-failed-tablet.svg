  <title id="wf-title">Exception — action failed — tablet</title>
  <desc id="wf-desc">Exception — action failed — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Exception — action failed header — title, synthetic context and available actions; 3 Failed action — inline error, row state unchanged. · frame 1 of 1; 4 Row state — still deferred; the failed action is not reflected as applied. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
