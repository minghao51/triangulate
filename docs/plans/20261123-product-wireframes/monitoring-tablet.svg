<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Monitoring — tablet</title>
  <desc id="wf-desc">Monitoring — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Monitoring header — title, synthetic context and available actions; 3 Recorded checks — stored observation time and status only; no health, scheduler or alert state. · frame 1 of 1; 4 Scope note — monitoring is a recorded-status reader, not an operations dashboard. · frame 1 of 1.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
    <rect x="0" y="0" width="768" height="1024" fill="#fff"/>
    <rect x="8" y="8" width="752" height="1008" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="32" y="32" width="704" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <text x="168" y="56" font-size="12" fill="#000">Dashboard</text>
    <text x="248" y="56" font-size="12" fill="#000">Cases</text>
    <text x="304" y="56" font-size="12" fill="#000" font-weight="600">Monitoring</text>
    <text x="392" y="56" font-size="12" fill="#000">AI info</text>
    <rect x="32" y="104" width="704" height="88" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="152" font-size="20" fill="#000" font-weight="600">Monitoring</text>
    <text x="48" y="176" font-size="12" fill="#666">Recorded status and times only · Proposal · synthetic · not built</text>
    <g data-pane="p1">
    <rect x="32" y="216" width="704" height="216" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="256" font-size="14" fill="#000" font-weight="600">Recorded checks</text>
    <text x="48" y="280" font-size="12" fill="#000" font-weight="600">Case</text>
    <text x="224" y="280" font-size="12" fill="#000" font-weight="600">Last observed</text>
    <text x="400" y="280" font-size="12" fill="#000" font-weight="600">Status</text>
    <text x="520" y="280" font-size="12" fill="#000" font-weight="600">Next run</text>
    <line x1="48" y1="288" x2="720" y2="288" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="320" font-size="12" fill="#000">case-2201-0417</text>
    <text x="224" y="320" font-size="12" fill="#000">2026-11-20 09:12</text>
    <text x="400" y="320" font-size="12" fill="#000">partial</text>
    <text x="520" y="320" font-size="12" fill="#000">not recorded</text>
    <text x="48" y="352" font-size="12" fill="#000">case-2199-1180</text>
    <text x="224" y="352" font-size="12" fill="#000">2026-11-19 18:40</text>
    <text x="400" y="352" font-size="12" fill="#000">succeeded</text>
    <text x="520" y="352" font-size="12" fill="#000">not recorded</text>
    <text x="48" y="384" font-size="12" fill="#000">case-2198-0922</text>
    <text x="224" y="384" font-size="12" fill="#000">2026-11-18 07:05</text>
    <text x="400" y="384" font-size="12" fill="#000">failed</text>
    <text x="520" y="384" font-size="12" fill="#000">not recorded</text>
    <text x="48" y="408" font-size="12" fill="#666">No telemetry is synthesized: missing scheduler data reads 'not recorded'.</text>
    </g>
    <g data-pane="p2">
    <rect x="32" y="456" width="704" height="136" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="496" font-size="14" fill="#000" font-weight="600">Not shown here</text>
    <text x="48" y="520" font-size="12" fill="#666">No health score, uptime or throughput</text>
    <text x="48" y="544" font-size="12" fill="#666">No alerting or paging</text>
    <text x="48" y="568" font-size="12" fill="#666">Scheduler state is not recorded</text>
    </g>
  </g>
  <g id="annotations" font-family="-apple-system, system-ui, sans-serif">
    <rect data-region="1" x="24" y="24" width="720" height="64" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
    <rect data-region="2" x="24" y="96" width="720" height="104" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
    <rect data-region="3" x="24" y="208" width="720" height="232" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
