  <title id="wf-title">Review — saving — tablet</title>
  <desc id="wf-desc">Review — saving — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Review — saving header — title, synthetic context and available actions; 3 Saving state — rationale only plus the three decision buttons; all controls disabled while the review POST is in flight and no success is claimed yet. · frame 1 of 1; 4 State scope note — what the state does and does not assert. · frame 1 of 1; 5 Write-scope note — a single narrow review write, explicit failure and no client retry loop. · frame 1 of 1.</desc>
