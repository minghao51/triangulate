<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Exception queue — tablet</title>
  <desc id="wf-desc">Exception queue — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Exception queue header — title, synthetic context and available actions; 3 Case tabs (12) — active Exceptions; tabs are navigation, not state changes; 4 Exception table — pending disables all row actions; an open row enables Resolve/Defer, a closed row enables Reopen. · frame 1 of 1; 5 Exception actions — the pending row disables Resolve, Defer and Reopen; open and closed rows enable their listed actions. · frame 1 of 1.</desc>
