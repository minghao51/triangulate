  <title id="wf-title">Dashboard — case portfolio — mobile</title>
  <desc id="wf-desc">Dashboard — case portfolio — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Dashboard — case portfolio header — title, synthetic context and available actions; 3 Case portfolio — observed status and acquisition coverage per case, not a truth score. Requires backend support: a coverage field on the case-list DTO; CaseListItem has none today. · frame 1 of 2.</desc>
