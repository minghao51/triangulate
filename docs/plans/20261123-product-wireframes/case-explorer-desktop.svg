<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Case explorer — desktop</title>
  <desc id="wf-desc">Case explorer — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Case explorer header — title, synthetic context and available actions; 3 Case filters — literal query, status and sort; no hidden full-text index is claimed. · frame 1 of 1; 4 Case table — per-case observed status, coverage and update time. · frame 1 of 1; 5 Pagination — disabled Previous on the first page; no synthetic totals. · frame 1 of 1.</desc>
