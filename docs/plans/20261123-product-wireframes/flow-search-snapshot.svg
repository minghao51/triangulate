  <title id="wf-title">Search and snapshot flow — desktop flow</title>
  <desc id="wf-desc">Search and snapshot flow — desktop flow (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Flow title — reading rule stated before any transition; order is navigation, not execution; 2 Thumbnail 1 — Case search (search); geometry-derived miniature, source text omitted; 3 Transition 1 — 'open': navigation/review path only; 4 Thumbnail 2 — Historical snapshot (historical-snapshot); geometry-derived miniature, source text omitted; 5 Transition 2 — 'context': navigation/review path only; 6 Thumbnail 3 — Case overview (case-overview); geometry-derived miniature, source text omitted; 7 Legend — thumbnail abstraction and grid rules; no automatic transition is implied.</desc>
