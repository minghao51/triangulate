  <desc id="wf-desc">Comparison — no second source — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — all seven destinations remain reachable; CLI owns ingest; 2 Comparison — no second source header — title, synthetic context and available actions; 3 No-second-source state — distinct from a selection error or an empty comparison. · frame 1 of 1; 4 Next step — a second source arrives through the operator CLI, never a browser form. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
