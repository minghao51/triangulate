  <desc id="wf-desc">Annotation — invalid input — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Annotation — invalid input header — title, synthetic context and available actions; 3 Invalid annotation — bad target and blank content are rejected block-side with 422. · frame 1 of 1; 4 422 validation — inline field errors; Save stays disabled. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
