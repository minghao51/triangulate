<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Comparison — desktop</title>
  <desc id="wf-desc">Comparison — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Comparison header — title, synthetic context and available actions; 3 Case tabs (12) — active Compare; tabs are navigation, not state changes; 4 Selection controls — four visible fields (left/right source and capture) plus Compare, Swap and Clear; selections stay in the URL. · frame 1 of 2; 5 Left source panel — its own capture time, hash and Open passage navigation. · frame 1 of 2; 6 Right source panel — its own capture time, hash and Open passage navigation; desktop side by side, tablet and mobile stack. · frame 1 of 2.</desc>
