    <text x="48" y="432" font-size="12" fill="#666">Reason: ambiguous</text>
    <text x="48" y="456" font-size="12" fill="#666">No fuzzy or casefold match used</text>
    <text x="48" y="480" font-size="12" fill="#666">A validated range is required</text>
    </g>
    <g data-pane="p3">
    <rect x="32" y="528" width="704" height="112" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="568" font-size="14" fill="#000" font-weight="600">Resolution</text>
    <text x="48" y="592" font-size="12" fill="#666">Offsets must match the exact quotation</text>
    <text x="48" y="616" font-size="12" fill="#666">Ambiguity stays visible until disambiguated</text>
    </g>
  </g>
