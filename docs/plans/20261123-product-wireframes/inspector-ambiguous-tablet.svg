    <rect x="0" y="0" width="768" height="1024" fill="#fff"/>
    <rect x="8" y="8" width="752" height="1008" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="32" y="32" width="704" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <text x="168" y="56" font-size="12" fill="#000">Dashboard</text>
    <text x="248" y="56" font-size="12" fill="#000" font-weight="600">Cases</text>
    <text x="304" y="56" font-size="12" fill="#000">Network</text>
    <text x="368" y="56" font-size="12" fill="#000">Sources</text>
    <text x="432" y="56" font-size="12" fill="#000">Narratives</text>
    <text x="520" y="56" font-size="12" fill="#000">Monitoring</text>
    <text x="608" y="56" font-size="12" fill="#000">AI info</text>
    <rect x="32" y="104" width="704" height="88" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="152" font-size="20" fill="#000" font-weight="600">Inspector — ambiguous quotation</text>
    <text x="48" y="176" font-size="12" fill="#666">Proposal · synthetic · not built</text>
    <g data-pane="p1">
    <rect x="32" y="216" width="704" height="128" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="256" font-size="14" fill="#000" font-weight="600">Candidate occurrences</text>
    <text x="48" y="288" font-size="14" fill="#000">offset 412</text>
    <text x="720" y="280" text-anchor="end" font-size="12" fill="#000">occurrence 1 of 2</text>
    <text x="48" y="320" font-size="14" fill="#000">offset 980</text>
    <text x="720" y="312" text-anchor="end" font-size="12" fill="#000">occurrence 2 of 2</text>
    </g>
    <g data-pane="p2">
