<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Inspector — ambiguous quotation — tablet</title>
  <desc id="wf-desc">Inspector — ambiguous quotation — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Inspector — ambiguous quotation header — title, synthetic context and available actions; 3 Ambiguity list — repeated exact matches without disambiguating offsets; nothing is highlighted. · frame 1 of 1; 4 State scope note — what the state does and does not assert. · frame 1 of 1; 5 Resolution note — only a unique exact occurrence becomes exact. · frame 1 of 1.</desc>
