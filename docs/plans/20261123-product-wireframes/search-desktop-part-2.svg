    <rect x="8" y="8" width="1264" height="784" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="32" y="32" width="1224" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <rect x="1176" y="40" width="64" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="1208" y="56" text-anchor="middle" font-size="12" fill="#000">Menu</text>
    <rect x="296" y="104" width="960" height="112" fill="#fff" stroke="#000" stroke-width="1.5"/>
