    <text x="1240" y="328" text-anchor="end" font-size="12" fill="#000">claim · body</text>
    <text x="312" y="368" font-size="14" fill="#000">ev-c71a · Regional Herald — “…tender notice lodged…”</text>
    <text x="1240" y="360" text-anchor="end" font-size="12" fill="#000">evidence · body</text>
