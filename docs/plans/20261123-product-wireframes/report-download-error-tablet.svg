  <title id="wf-title">Report — download error — tablet</title>
  <desc id="wf-desc">Report — download error — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Report — download error header — title, synthetic context and available actions; 3 Download error — explicit failure, no empty document rendered. · frame 1 of 1; 4 Artifact note — the run-specific directory and stored formats. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
