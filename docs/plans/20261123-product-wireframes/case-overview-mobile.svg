  <title id="wf-title">Case overview — mobile</title>
  <desc id="wf-desc">Case overview — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Case overview header — title, synthetic context and available actions; 3 Case tabs (12) — active Overview; the strip scrolls, no tab is removed; 4 Observed counts — only observed rows; a failed read is unavailable, never zero. · frame 1 of 2.</desc>
