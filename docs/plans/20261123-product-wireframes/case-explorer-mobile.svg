<!-- viewport: 375×812 mobile -->
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Case explorer — mobile</title>
  <desc id="wf-desc">Case explorer — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — all seven destinations remain reachable; CLI owns ingest; 2 Case explorer header — title, synthetic context and available actions; 3 Case filters — literal query, status and sort; no hidden full-text index is claimed. · frame 1 of 3.</desc>
