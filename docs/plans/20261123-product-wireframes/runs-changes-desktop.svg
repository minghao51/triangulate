<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Runs and changes — desktop</title>
  <desc id="wf-desc">Runs and changes — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Runs and changes header — title, synthetic context and available actions; 3 Case tabs (12) — active Changes; tabs are navigation, not state changes; 4 Grouped run selector — an actual selector field listing run-0007 (run-0006 selectable), plus Refresh and Permalink; the selection is pinned in the URL. · frame 1 of 2; 5 Baseline and target snapshot ids with the coverage warning. · frame 1 of 2; 6 Run semantics — pending, failed and attribution rules stated next to the selector. · frame 1 of 2; 7 Typed before/after rows — review_state_changed carries the case review state, not a claim verification state. · frame 1 of 2.</desc>
