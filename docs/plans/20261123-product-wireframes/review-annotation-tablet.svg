<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Review and annotation — tablet</title>
  <desc id="wf-desc">Review and annotation — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Review and annotation header — title, synthetic context and available actions; 3 Case tabs (12) — active Overview; tabs are navigation, not state changes; 4 Review decision form — rationale plus the three decision buttons; decision value is the pressed control, not a dropdown. · frame 1 of 2; 5 Annotation form — type comment/flag/context, target case/claim/evidence/exception/narrative, target ID and content; save disabled while empty or pending. · frame 1 of 2; 6 Recorded annotations — stored rows with type and target; no attribution beyond the stored record. · frame 1 of 2.</desc>
