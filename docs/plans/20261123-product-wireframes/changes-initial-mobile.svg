  <title id="wf-title">Changes — first observation — mobile</title>
  <desc id="wf-desc">Changes — first observation — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Changes — first observation header — title, synthetic context and available actions; 3 Initial banner — the first snapshot has no baseline and is not a change surge. · frame 1 of 1; 4 Snapshot facts — first snapshot identifiers and coverage. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
