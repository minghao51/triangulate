  <title id="wf-title">Review — case data changed — tablet</title>
  <desc id="wf-desc">Review — case data changed — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Review — case data changed header — title, synthetic context and available actions; 3 Stale banner — the form is frozen rather than silently overwriting newer data. · frame 1 of 1; 4 Frozen form — the three decision buttons are disabled until the newer case state is reloaded; Reload case is the only enabled control. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
