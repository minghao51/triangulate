  <title id="wf-title">Comparison — historical unavailable — mobile</title>
  <desc id="wf-desc">Comparison — historical unavailable — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Comparison — historical unavailable header — title, synthetic context and available actions; 3 Historical banner — an old capture without retained alignment stays unavailable. · frame 1 of 1; 4 Capture context — each side reads its stored capture; no latest links. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
