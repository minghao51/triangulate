<!-- viewport: 375×812 mobile -->
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Evaluation — no saved evaluation — mobile</title>
  <desc id="wf-desc">Evaluation — no saved evaluation — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Evaluation — no saved evaluation header — title, synthetic context and available actions; 3 Unavailable evaluation — absence of a saved result, not a score of zero. · frame 1 of 1; 4 State scope note — what the state does and does not assert. · frame 1 of 1; 5 What remains — claim reading is independent of a saved evaluation. · frame 1 of 1.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
    <rect x="0" y="0" width="368" height="808" fill="#fff"/>
    <rect x="8" y="8" width="352" height="792" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="16" y="32" width="328" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <rect x="264" y="40" width="64" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="296" y="56" text-anchor="middle" font-size="12" fill="#000">Menu</text>
    <rect x="16" y="104" width="328" height="112" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="144" font-size="14" fill="#000" font-weight="600">Evaluation — no saved</text>
    <text x="32" y="176" font-size="14" fill="#000" font-weight="600">evaluation</text>
    <text x="32" y="200" font-size="12" fill="#666">Proposal · synthetic · not built</text>
    <g data-pane="p1">
    <rect x="16" y="240" width="328" height="160" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="280" font-size="14" fill="#000" font-weight="600">Evaluation</text>
    <rect x="32" y="288" width="296" height="96" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="328" font-size="14" fill="#000">No saved evaluation for this…</text>
    <text x="48" y="352" font-size="12" fill="#666">The reader found no stored evaluat…</text>
    </g>
    <g data-pane="p2">
    <rect x="16" y="424" width="328" height="136" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="464" font-size="14" fill="#000" font-weight="600">What this is not</text>
    <text x="32" y="488" font-size="12" fill="#666">Missing evaluation is not 0</text>
    <text x="32" y="512" font-size="12" fill="#666">No computed-on-read evaluation</text>
    <text x="32" y="536" font-size="12" fill="#666">Claim list stays readable</text>
    </g>
    <g data-pane="p3">
    <rect x="16" y="584" width="328" height="136" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="624" font-size="14" fill="#000" font-weight="600">What remains</text>
    <text x="32" y="648" font-size="12" fill="#000">Claims and citations still readable</text>
    <text x="32" y="672" font-size="12" fill="#000">Arbiter analysis stays model-labelled</text>
    <text x="32" y="696" font-size="12" fill="#000">No verdict is inferred</text>
    </g>
  </g>
  <g id="annotations" font-family="-apple-system, system-ui, sans-serif">
    <rect data-region="1" x="8" y="24" width="344" height="64" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
