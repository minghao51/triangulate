    <text x="48" y="176" font-size="12" fill="#666">Observed case rows only · Proposal · synthetic · not built</text>
    <text x="48" y="200" font-size="12" fill="#666">No KPI tiles, scores or health metrics</text>
    <g data-pane="p1">
    <rect x="32" y="240" width="704" height="224" fill="#fff" stroke="#000" stroke-width="1.5"/>
