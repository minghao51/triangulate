    <text x="168" y="56" font-size="12" fill="#000" font-weight="600">Dashboard</text>
    <text x="248" y="56" font-size="12" fill="#000">Cases</text>
    <text x="304" y="56" font-size="12" fill="#000">Network</text>
    <text x="368" y="56" font-size="12" fill="#000">Sources</text>
    <text x="432" y="56" font-size="12" fill="#000">Narratives</text>
    <text x="520" y="56" font-size="12" fill="#000">Monitoring</text>
    <text x="608" y="56" font-size="12" fill="#000">AI info</text>
