    <text x="312" y="304" font-size="12" fill="#000" font-weight="600">Status</text>
    <text x="488" y="304" font-size="12" fill="#000" font-weight="600">Coverage</text>
    <line x1="48" y1="312" x2="720" y2="312" stroke="#000" stroke-width="1.5"/>
