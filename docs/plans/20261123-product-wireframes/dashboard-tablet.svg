<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Dashboard — case portfolio — tablet</title>
  <desc id="wf-desc">Dashboard — case portfolio — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Dashboard — case portfolio header — title, synthetic context and available actions; 3 Case portfolio — observed status and acquisition coverage per case, not a truth score. · frame 1 of 1; 4 Observed totals — row counts only; no confidence, health or trend claim. · frame 1 of 1; 5 Recent grouped runs — recorded status and coverage across cases. · frame 1 of 1; 6 Navigation entry points — monitoring and AI info are readers, not control planes. · frame 1 of 1.</desc>
