<!-- viewport: 375×812 mobile -->
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Capture inspector — mobile</title>
  <desc id="wf-desc">Capture inspector — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — all seven destinations remain reachable; CLI owns ingest; 2 Capture inspector header — title, synthetic context and available actions; 3 Case tabs (12) — active Evidence; the strip scrolls, no tab is removed; 4 Claim and immutable citation — frozen claim text, relationship and model assessment provenance. · frame 1 of 3; 5 Capture metadata — publisher host, observation and recording times, hash, published-unavailable and recorded extraction scope. · frame 1 of 3.</desc>
