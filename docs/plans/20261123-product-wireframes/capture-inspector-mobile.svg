    <rect x="16" y="104" width="328" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="144" font-size="14" fill="#000" font-weight="600">Capture inspector</text>
    <text x="32" y="168" font-size="12" fill="#666">Immutable capture reads only · Proposa…</text>
