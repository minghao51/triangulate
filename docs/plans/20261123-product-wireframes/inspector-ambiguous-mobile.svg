<!-- viewport: 375×812 mobile -->
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Inspector — ambiguous quotation — mobile</title>
  <desc id="wf-desc">Inspector — ambiguous quotation — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Inspector — ambiguous quotation header — title, synthetic context and available actions; 3 Ambiguity list — repeated exact matches without disambiguating offsets; nothing is highlighted. · frame 1 of 1; 4 State scope note — what the state does and does not assert. · frame 1 of 1; 5 Resolution note — only a unique exact occurrence becomes exact. · frame 1 of 1.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
    <rect x="0" y="0" width="368" height="808" fill="#fff"/>
    <rect x="8" y="8" width="352" height="792" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="16" y="32" width="328" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <rect x="264" y="40" width="64" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="296" y="56" text-anchor="middle" font-size="12" fill="#000">Menu</text>
    <rect x="16" y="104" width="328" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="144" font-size="14" fill="#000" font-weight="600">Inspector — ambiguous quotation</text>
    <text x="32" y="168" font-size="12" fill="#666">Proposal · synthetic · not built</text>
    <g data-pane="p1">
    <rect x="16" y="208" width="328" height="128" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="248" font-size="14" fill="#000" font-weight="600">Candidate occurrences</text>
    <text x="32" y="280" font-size="14" fill="#000">offset 412</text>
    <text x="328" y="272" text-anchor="end" font-size="12" fill="#000">occurrence 1 of 2</text>
    <text x="32" y="312" font-size="14" fill="#000">offset 980</text>
    <text x="328" y="304" text-anchor="end" font-size="12" fill="#000">occurrence 2 of 2</text>
    </g>
    <g data-pane="p2">
    <rect x="16" y="360" width="328" height="136" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="400" font-size="14" fill="#000" font-weight="600">What this is not</text>
    <text x="32" y="424" font-size="12" fill="#666">Reason: ambiguous</text>
    <text x="32" y="448" font-size="12" fill="#666">No fuzzy or casefold match used</text>
    <text x="32" y="472" font-size="12" fill="#666">A validated range is required</text>
    </g>
    <g data-pane="p3">
    <rect x="16" y="520" width="328" height="136" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="560" font-size="14" fill="#000" font-weight="600">Resolution</text>
    <text x="32" y="584" font-size="12" fill="#666">Offsets must match the exact quotation</text>
    <text x="32" y="608" font-size="12" fill="#666">Ambiguity stays visible until</text>
    <text x="32" y="632" font-size="12" fill="#666">disambiguated</text>
    </g>
  </g>
  <g id="annotations" font-family="-apple-system, system-ui, sans-serif">
    <rect data-region="1" x="8" y="24" width="344" height="64" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
    <rect data-region="2" x="8" y="96" width="344" height="96" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
