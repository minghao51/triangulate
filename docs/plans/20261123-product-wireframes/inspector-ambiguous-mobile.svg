    <rect data-region="4" x="8" y="352" width="344" height="152" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
    <rect data-region="5" x="8" y="512" width="344" height="152" fill="none" stroke="#d33" stroke-width="1.5" stroke-dasharray="8 8"/>
