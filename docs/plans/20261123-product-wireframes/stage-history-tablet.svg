  <title id="wf-title">Run history (stage-oriented) — tablet</title>
  <desc id="wf-desc">Run history (stage-oriented) — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Run history (stage-oriented) header — title, synthetic context and available actions; 3 Case tabs (12) — active Run history; tabs are navigation, not state changes; 4 Stage attempts — per-stage model, duration, fallback flag, status and recorded time; not grouped investigation runs. · frame 1 of 1; 5 Interpretation — this tab remains stage-oriented; grouped runs and deltas are a separate reader. · frame 1 of 1.</desc>
