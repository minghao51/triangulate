<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Capture inspector — desktop</title>
  <desc id="wf-desc">Capture inspector — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Capture inspector header — title, synthetic context and available actions; 3 Case tabs (12) — active Evidence; tabs are navigation, not state changes; 4 Claim and immutable citation — frozen claim text, relationship and model assessment provenance. · frame 1 of 1; 5 Capture metadata — publisher host, observation and recording times, hash, published-unavailable and recorded extraction scope. · frame 1 of 1; 6 Synthetic passage block — grey box stands for captured text; labelled mock example, so no validated code-point range is claimed. · frame 1 of 1; 7 Capture version selector and Open source control — an actual field plus a safe HTTP(S) link control; both are visible, not prose only. · frame 1 of 1; 8 Provenance — provisional publisher host, unknown independence and both source URLs. · frame 1 of 1; 9 Reader notes — quotation validation rules and the synthetic-passage limitation. · frame 1 of 1.</desc>
