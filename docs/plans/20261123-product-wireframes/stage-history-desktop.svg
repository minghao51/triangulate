<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Run history (stage-oriented) — desktop</title>
  <desc id="wf-desc">Run history (stage-oriented) — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Run history (stage-oriented) header — title, synthetic context and available actions; 3 Case tabs (12) — active Run history; tabs are navigation, not state changes; 4 Stage attempts — per-stage model, duration, fallback flag, status and recorded time; not grouped investigation runs. · frame 1 of 1; 5 Interpretation — this tab remains stage-oriented; grouped runs and deltas are a separate reader. · frame 1 of 1.</desc>
