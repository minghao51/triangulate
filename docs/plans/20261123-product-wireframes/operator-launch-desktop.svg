<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Operator launch guide — desktop</title>
  <desc id="wf-desc">Operator launch guide — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Operator launch guide header — title, synthetic context and available actions; 3 Launch steps — the only ingestion path is a local CLI command, not this page. · frame 1 of 1; 4 Prerequisites — local database, single writer, operator-run network access. · frame 1 of 1; 5 Scope note — the browser exposes reads and three narrow review POSTs only. · frame 1 of 1.</desc>
