  <title id="wf-title">Pipeline — stage unrecorded — tablet</title>
  <desc id="wf-desc">Pipeline — stage unrecorded — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Pipeline — stage unrecorded header — title, synthetic context and available actions; 3 Unrecorded stages — no attempt row exists; unrecorded is not success and not failure. · frame 1 of 1; 4 State scope note — what the state does and does not assert. · frame 1 of 1; 5 Configuration note — the configured count and recorded count differ honestly. · frame 1 of 1.</desc>
