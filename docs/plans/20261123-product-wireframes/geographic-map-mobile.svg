  <title id="wf-title">Geographic map — mobile</title>
  <desc id="wf-desc">Geographic map — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — all seven destinations remain reachable; CLI owns ingest; 2 Geographic map header — title, synthetic context and available actions; 3 Case tabs (12) — active Map; the strip scrolls, no tab is removed; 4 Map area — placeholder X and geotagged markers; no map tiles are loaded or implied. · frame 1 of 2; 5 Event list — geotagged events only; untagged events are listed as unknown place. · frame 1 of 2.</desc>
