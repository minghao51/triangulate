<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Corroboration network — desktop</title>
  <desc id="wf-desc">Corroboration network — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Corroboration network header — title, synthetic context and available actions; 3 Claim and source graph — rect nodes and line edges; a shared edge is not independent proof. · frame 1 of 1; 4 Adversarial investigation flow — Collector, classifier, investigators, Arbiter; only recorded outcomes are shown, never completed merely because configured. · frame 1 of 1; 5 Edge and outcome list — relationship per edge plus the prior run's recorded Arbiter counts; facts and allegations are model classifications, not certification. · frame 1 of 1; 6 Reading rule — no independence or completion claim from graph shape alone. · frame 1 of 1.</desc>
