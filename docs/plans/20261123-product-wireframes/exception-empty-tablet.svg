  <title id="wf-title">Exception — none recorded — tablet</title>
  <desc id="wf-desc">Exception — none recorded — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Exception — none recorded header — title, synthetic context and available actions; 3 Empty queue — not a failed read and not an unavailable capability. · frame 1 of 1; 4 Interpretation note — an empty queue is a valid read, not a failure. · frame 1 of 1.</desc>
