  <title id="wf-title">Comparison — no aligned rows — tablet</title>
  <desc id="wf-desc">Comparison — no aligned rows — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Comparison — no aligned rows header — title, synthetic context and available actions; 3 Selection summary — both captures are pinned and readable. · frame 1 of 1; 4 Empty comparison — a valid empty alignment is not an unavailable historical capture. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
