<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Evidence gallery — tablet</title>
  <desc id="wf-desc">Evidence gallery — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Evidence gallery header — title, synthetic context and available actions; 3 Case tabs (12) — active Evidence; tabs are navigation, not state changes; 4 Evidence filters — All/High/Medium/Low/Unknown are provided extraction tiers, not truth levels. · frame 1 of 2; 5 Evidence table — source, publisher and provided tier; missing capture says unavailable. · frame 1 of 2; 6 Selected source pane — title, capture pointer, provided tier and stored verification metadata labelled model/legacy_unknown; never certified truth. · frame 1 of 2; 7 Selected-source actions — Inspect source, safe HTTP(S) Open source and Verification details. · frame 1 of 2.</desc>
