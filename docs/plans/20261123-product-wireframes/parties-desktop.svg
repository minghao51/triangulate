<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Parties — desktop</title>
  <desc id="wf-desc">Parties — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Parties header — title, synthetic context and available actions; 3 Case tabs (12) — active Parties; tabs are navigation, not state changes; 4 Party table — recorded, inferred or confirmed basis; counts are recorded rows, never guessed stance. · frame 1 of 1; 5 Expanded party accordion — recorded/model position, concerns, priorities, supported/contested/unique claim counts and explicit unavailable fields. · frame 1 of 1; 6 Honesty rules — recorded/model party position only; missing data is shown, never invented. · frame 1 of 1.</desc>
