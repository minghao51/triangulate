    <text x="168" y="56" font-size="12" fill="#000">Dashboard</text>
    <text x="248" y="56" font-size="12" fill="#000" font-weight="600">Cases</text>
    <text x="304" y="56" font-size="12" fill="#000">Monitoring</text>
    <text x="392" y="56" font-size="12" fill="#000">AI info</text>
    <rect x="32" y="104" width="704" height="88" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="152" font-size="20" fill="#000" font-weight="600">Geographic map</text>
    <text x="48" y="176" font-size="12" fill="#666">Geotagged placeholders, no tiles · Proposal · synthetic · not built</text>
    <rect x="32" y="216" width="704" height="72" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="248" font-size="12" fill="#000">Overview</text>
    <text x="128" y="248" font-size="12" fill="#000">Evidence</text>
    <text x="208" y="248" font-size="12" fill="#000">Claims</text>
    <text x="272" y="248" font-size="12" fill="#000">Compare</text>
    <text x="344" y="248" font-size="12" fill="#000">Parties</text>
    <text x="416" y="248" font-size="12" fill="#000" font-weight="600">Map</text>
    <text x="48" y="272" font-size="12" fill="#000">Timeline</text>
