<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Geographic map — tablet</title>
  <desc id="wf-desc">Geographic map — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Geographic map header — title, synthetic context and available actions; 3 Case tabs (12) — active Map; tabs are navigation, not state changes; 4 Map area — placeholder X and geotagged markers; no map tiles are loaded or implied. · frame 1 of 1; 5 Event list — geotagged events only; untagged events are listed as unknown place. · frame 1 of 1; 6 Place data — untagged stays unknown; the map is a placeholder, not a live basemap. · frame 1 of 1.</desc>
