    <line x1="72" y1="384" x2="696" y2="576" stroke="#000" stroke-width="1.5"/>
    <line x1="696" y1="384" x2="72" y2="576" stroke="#000" stroke-width="1.5"/>
    <rect x="176" y="424" width="16" height="16" fill="#fff" stroke="#000" stroke-width="1.5"/>
