<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Review — blocked by exceptions — tablet</title>
  <desc id="wf-desc">Review — blocked by exceptions — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Review — blocked by exceptions header — title, synthetic context and available actions; 3 Blocked state — 422 approval blocked by unresolved exceptions; links the queue. · frame 1 of 1; 4 Unresolved exception list — the blocking rows with their recorded states. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
    <rect x="0" y="0" width="768" height="1024" fill="#fff"/>
    <rect x="8" y="8" width="752" height="1008" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="32" y="32" width="704" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <text x="168" y="56" font-size="12" fill="#000">Dashboard</text>
    <text x="248" y="56" font-size="12" fill="#000" font-weight="600">Cases</text>
    <text x="304" y="56" font-size="12" fill="#000">Monitoring</text>
    <text x="392" y="56" font-size="12" fill="#000">AI info</text>
    <rect x="32" y="104" width="704" height="88" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="152" font-size="20" fill="#000" font-weight="600">Review — blocked by exceptions</text>
    <text x="48" y="176" font-size="12" fill="#666">Proposal · synthetic · not built</text>
    <g data-pane="p1">
    <rect x="32" y="216" width="704" height="224" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="256" font-size="14" fill="#000" font-weight="600">Approval blocked · 422</text>
    <rect x="48" y="264" width="672" height="120" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="64" y="296" font-size="14" fill="#000" font-weight="600">Unresolved exceptions must be resolved first</text>
    <text x="64" y="320" font-size="12" fill="#666">exceptions: exc-2310, exc-2309</text>
    <text x="64" y="344" font-size="12" fill="#666">No decision was saved</text>
    <rect x="48" y="392" width="176" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="56" y="416" font-size="12" fill="#000">Open exception queue</text>
    </g>
    <g data-pane="p2">
    <rect x="32" y="464" width="704" height="128" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="504" font-size="14" fill="#000" font-weight="600">Unresolved exceptions</text>
    <text x="48" y="536" font-size="14" fill="#000">exc-2310 · missing quotation</text>
    <text x="720" y="528" text-anchor="end" font-size="12" fill="#000">pending</text>
    <text x="48" y="568" font-size="14" fill="#000">exc-2309 · source unavailable</text>
    <text x="720" y="560" text-anchor="end" font-size="12" fill="#000">deferred</text>
    </g>
    <g data-pane="p3">
    <rect x="32" y="616" width="704" height="136" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="656" font-size="14" fill="#000" font-weight="600">What this is not</text>
    <text x="48" y="680" font-size="12" fill="#666">Blocked is not saved</text>
    <text x="48" y="704" font-size="12" fill="#666">No override control in the browser</text>
    <text x="48" y="728" font-size="12" fill="#666">CLI fallback is documented</text>
    </g>
  </g>
