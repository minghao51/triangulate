    <text x="312" y="104" font-size="12" fill="#666">Reads the stored snapshot, never the latest row · Proposal · synthetic · not built</text>
    <g data-pane="p1">
    <rect x="296" y="144" width="464" height="160" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="312" y="184" font-size="14" fill="#000" font-weight="600">Snapshot</text>
    <text x="312" y="208" font-size="12" fill="#000">snapshot-s002 · case-2201-0417</text>
    <text x="312" y="232" font-size="12" fill="#000">run-0006 · succeeded · complete scope</text>
