    <line x1="48" y1="88" x2="256" y2="88" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="128" font-size="12" fill="#000" font-weight="600">NAVIGATE</text>
    <text x="48" y="160" font-size="14" fill="#000">Dashboard</text>
