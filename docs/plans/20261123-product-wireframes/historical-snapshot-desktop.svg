<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Historical snapshot — desktop</title>
  <desc id="wf-desc">Historical snapshot — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Historical snapshot header — title, synthetic context and available actions; 3 Snapshot metadata — frozen identifiers, versions and creation time. · frame 1 of 1; 4 Frozen claim — claim text from the baseline snapshot, retrieved by immutable reference. · frame 1 of 1; 5 Immutable passage — frozen quotation range and its capture; no latest-capture substitution. · frame 1 of 1; 6 Live-state note — distinguishes gone/rewritten from unchanged without attribution. · frame 1 of 1.</desc>
