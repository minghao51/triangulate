  <title id="wf-title">Evidence gallery — desktop</title>
  <desc id="wf-desc">Evidence gallery — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Evidence gallery header — title, synthetic context and available actions; 3 Case tabs (12) — active Evidence; tabs are navigation, not state changes; 4 Evidence filters — All/High/Medium/Low/Unknown are provided extraction tiers, not truth levels. · frame 1 of 2; 5 Evidence table — source, publisher and provided tier; missing capture says unavailable. · frame 1 of 2.</desc>
