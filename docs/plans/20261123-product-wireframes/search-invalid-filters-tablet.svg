  <title id="wf-title">Search — invalid filters — tablet</title>
  <desc id="wf-desc">Search — invalid filters — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Search — invalid filters header — title, synthetic context and available actions; 3 Invalid filter combination — status applies to claims only and conflicts with evidence-only type. · frame 1 of 1; 4 422 state — invalid combination is explained inline. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
