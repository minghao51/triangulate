  <title id="wf-title">Historical snapshot — mobile</title>
  <desc id="wf-desc">Historical snapshot — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Historical snapshot header — title, synthetic context and available actions; 3 Snapshot metadata — frozen identifiers, versions and creation time. · frame 1 of 2; 4 Frozen claim — claim text from the baseline snapshot, retrieved by immutable reference. · frame 1 of 2; 5 Immutable passage — frozen quotation range and its capture; no latest-capture substitution. · frame 1 of 2.</desc>
