<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Case search — tablet</title>
  <desc id="wf-desc">Case search — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Case search header — title, synthetic context and available actions; 3 Case tabs (12) — active Search; tabs are navigation, not state changes; 4 Search filters — six visible fields: literal all-term query, type All/claim/evidence, publisher, claim status, and UTC published-from/before (before is end-exclusive). · frame 1 of 2; 5 Results — plain-text mock snippets with the matched field; each row has Open result navigation. Snippets never imply a validated quotation. · frame 1 of 2.</desc>
