<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Operator launch guide — tablet</title>
  <desc id="wf-desc">Operator launch guide — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Operator launch guide header — title, synthetic context and available actions; 3 Launch steps — the only ingestion path is a local CLI command, not this page. · frame 1 of 1; 4 Prerequisites — local database, single writer, operator-run network access. · frame 1 of 1; 5 Scope note — the browser exposes reads and three narrow review POSTs only. · frame 1 of 1.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
    <rect x="0" y="0" width="768" height="1024" fill="#fff"/>
    <rect x="8" y="8" width="752" height="1008" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="32" y="32" width="704" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <text x="168" y="56" font-size="12" fill="#000">Dashboard</text>
    <text x="248" y="56" font-size="12" fill="#000" font-weight="600">Cases</text>
    <text x="304" y="56" font-size="12" fill="#000">Monitoring</text>
    <text x="392" y="56" font-size="12" fill="#000">AI info</text>
    <rect x="32" y="104" width="704" height="112" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="152" font-size="20" fill="#000" font-weight="600">Operator launch guide</text>
    <text x="48" y="176" font-size="12" fill="#666">CLI guide — no browser ingestion form · Proposal · synthetic · not built</text>
    <text x="48" y="200" font-size="12" fill="#666">Commands run locally under the local/trusted assumption</text>
    <g data-pane="p1">
    <rect x="32" y="240" width="704" height="136" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="280" font-size="14" fill="#000" font-weight="600">Launch steps (CLI)</text>
    <text x="48" y="304" font-size="12" fill="#000">1. uv run triangulate ingest</text>
    <text x="48" y="328" font-size="12" fill="#000">2. uv run triangulate process</text>
    <text x="48" y="352" font-size="12" fill="#000">3. uv run triangulate fetch-topic "quartz tender"</text>
    </g>
    <g data-pane="p2">
    <rect x="32" y="400" width="704" height="192" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="440" font-size="14" fill="#000" font-weight="600">Prerequisites</text>
    <text x="48" y="464" font-size="12" fill="#000" font-weight="600">Check</text>
    <text x="440" y="464" font-size="12" fill="#000" font-weight="600">State</text>
    <line x1="48" y1="472" x2="720" y2="472" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="504" font-size="12" fill="#000">Database</text>
    <text x="440" y="504" font-size="12" fill="#000">local</text>
    <text x="48" y="536" font-size="12" fill="#000">Writer</text>
    <text x="440" y="536" font-size="12" fill="#000">single</text>
    <text x="48" y="568" font-size="12" fill="#000">Network</text>
    <text x="440" y="568" font-size="12" fill="#000">operator</text>
    </g>
    <g data-pane="p3">
    <rect x="32" y="616" width="704" height="112" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="656" font-size="14" fill="#000" font-weight="600">Why no form</text>
    <text x="48" y="680" font-size="12" fill="#666">Ingest, rerun, rebuild and recovery are CLI-only</text>
    <text x="48" y="704" font-size="12" fill="#666">This page never posts a case or a run</text>
    </g>
  </g>
