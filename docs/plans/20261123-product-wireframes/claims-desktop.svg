<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Claims — desktop</title>
  <desc id="wf-desc">Claims — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Claims header — title, synthetic context and available actions; 3 Case tabs (12) — active Claims; tabs are navigation, not state changes; 4 Claims list — cluster text, linked source count and alignment state; generated relations are reported_by or uncertain. · frame 1 of 1; 5 Selected claim detail — frozen citation reference, effective relation and assessment provenance. · frame 1 of 1; 6 Claim actions — Inspect evidence opens the inspector; Open frozen citation opens the immutable citation reader. · frame 1 of 1; 7 Expanded claim detail — model-labelled Arbiter classification, rationale and recorded for/against/neutral party positions; consensus is not truth. · frame 1 of 1; 8 Detail provenance — model origin stays visible and the frozen citation links to the inspector. · frame 1 of 1.</desc>
