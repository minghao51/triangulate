<!-- viewport: 375×812 mobile -->
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Operator launch guide — mobile</title>
  <desc id="wf-desc">Operator launch guide — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — all seven destinations remain reachable; CLI owns ingest; 2 Operator launch guide header — title, synthetic context and available actions; 3 Launch steps — the only ingestion path is a local CLI command, not this page. · frame 1 of 2; 4 Prerequisites — local database, single writer, operator-run network access. · frame 1 of 2.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
    <rect x="0" y="0" width="368" height="808" fill="#fff"/>
    <rect x="8" y="8" width="352" height="792" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <rect x="16" y="32" width="328" height="48" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="56" font-size="14" fill="#000" font-weight="600">TRIANGULATE</text>
    <rect x="264" y="40" width="64" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="296" y="56" text-anchor="middle" font-size="12" fill="#000">Menu</text>
    <rect x="16" y="104" width="328" height="104" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="144" font-size="14" fill="#000" font-weight="600">Operator launch guide</text>
    <text x="32" y="168" font-size="12" fill="#666">CLI guide — no browser ingestion form…</text>
    <text x="32" y="192" font-size="12" fill="#666">Commands run locally under the local/t…</text>
    <g data-pane="p1">
    <rect x="16" y="232" width="328" height="160" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="272" font-size="14" fill="#000" font-weight="600">Launch steps (CLI)</text>
    <text x="32" y="296" font-size="12" fill="#000">1. uv run triangulate ingest</text>
    <text x="32" y="320" font-size="12" fill="#000">2. uv run triangulate process</text>
    <text x="32" y="344" font-size="12" fill="#000">3. uv run triangulate fetch-topic</text>
    <text x="32" y="368" font-size="12" fill="#000">"quartz tender"</text>
    </g>
    <g data-pane="p2">
    <rect x="16" y="416" width="328" height="256" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="456" font-size="14" fill="#000" font-weight="600">Prerequisites</text>
    <text x="32" y="488" font-size="14" fill="#000">Database</text>
    <text x="32" y="512" font-size="12" fill="#666">State: local</text>
    <line x1="32" y1="520" x2="328" y2="520" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="552" font-size="14" fill="#000">Writer</text>
    <text x="32" y="576" font-size="12" fill="#666">State: single</text>
    <line x1="32" y1="584" x2="328" y2="584" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="616" font-size="14" fill="#000">Network</text>
    <text x="32" y="640" font-size="12" fill="#666">State: operator</text>
    <line x1="32" y1="648" x2="328" y2="648" stroke="#000" stroke-width="1.5"/>
    </g>
  </g>
