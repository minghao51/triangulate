<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Review and annotation — desktop</title>
  <desc id="wf-desc">Review and annotation — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Review and annotation header — title, synthetic context and available actions; 3 Case tabs (12) — active Overview; tabs are navigation, not state changes; 4 Review decision form — rationale plus the three decision buttons; decision value is the pressed control, not a dropdown. · frame 1 of 1; 5 Annotation form — type comment/flag/context, target case/claim/evidence/exception/narrative, target ID and content; save disabled while empty or pending. · frame 1 of 1; 6 Recorded annotations — stored rows with type and target; no attribution beyond the stored record. · frame 1 of 1; 7 Reader-rule note — the annotation POST is an explicit, labelled exception to the GET-only reader rule. · frame 1 of 1.</desc>
  <g id="ui" font-family="-apple-system, system-ui, sans-serif">
