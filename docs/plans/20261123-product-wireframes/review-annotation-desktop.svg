    <text x="744" y="688" text-anchor="end" font-size="12" fill="#000">exc-2310</text>
    </g>
    <g data-pane="p4">
    <rect x="784" y="560" width="472" height="112" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="800" y="600" font-size="14" fill="#000" font-weight="600">Reader rule</text>
    <text x="800" y="624" font-size="12" fill="#666">An annotation is a human note, not a claim verdict</text>
    <text x="800" y="648" font-size="12" fill="#666">Saving writes to the reader DB; ingest stays CLI-only</text>
    </g>
  </g>
