<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Timeline — tablet</title>
  <desc id="wf-desc">Timeline — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Timeline header — title, synthetic context and available actions; 3 Case tabs (12) — active Timeline; tabs are navigation, not state changes; 4 Timeline entries — each row shows a verification state; a missing timestamp is shown as unknown and never inferred. · frame 1 of 1; 5 Verification vocabulary — the six stored states; an unexpected raw value renders as 'Unrecognized status', and an unknown date stays distinct from the state. · frame 1 of 1.</desc>
