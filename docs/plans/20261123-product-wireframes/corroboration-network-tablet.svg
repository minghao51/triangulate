  <title id="wf-title">Corroboration network — tablet</title>
  <desc id="wf-desc">Corroboration network — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Corroboration network header — title, synthetic context and available actions; 3 Claim and source graph — rect nodes and line edges; a shared edge is not independent proof. · frame 1 of 2; 4 Adversarial investigation flow — Collector, classifier, investigators, Arbiter; only recorded outcomes are shown, never completed merely because configured. · frame 1 of 2; 5 Edge and outcome list — relationship per edge plus the prior run's recorded Arbiter counts; facts and allegations are model classifications, not certification. · frame 1 of 2.</desc>
