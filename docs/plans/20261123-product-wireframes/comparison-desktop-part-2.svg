  <title id="wf-title">Comparison — part 2 of 2 — desktop</title>
  <desc id="wf-desc">Comparison — part 2 of 2 — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — all seven destinations remain reachable; CLI owns ingest; 2 Comparison — frame 2 of 2; full coverage continues in the named companion frame; 3 Alignment rows — explicit 'Reported in both extractions' and 'Extracted only on left/right' labels, never omission or disagreement. · frame 2 of 2; 4 Dependency warning — detected copy edge reasons; never presented as corroboration or independence. · frame 2 of 2; 5 Pagination controls — actual previous/next controls; offset stays in the URL. · frame 2 of 2.</desc>
