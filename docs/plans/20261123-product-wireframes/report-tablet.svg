<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Report — tablet</title>
  <desc id="wf-desc">Report — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Report header — title, synthetic context and available actions; 3 Case tabs (12) — active Report; tabs are navigation, not state changes; 4 Report pane — document preview plus Markdown/JSON downloads; a missing artifact keeps its control disabled. · frame 1 of 1; 5 Report facts — run-specific paths and formats; the report is stored, not regenerated on read. · frame 1 of 1; 6 Historical reports — report documents bind to their run and snapshot. · frame 1 of 1.</desc>
