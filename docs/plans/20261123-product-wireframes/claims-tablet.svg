<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Claims — tablet</title>
  <desc id="wf-desc">Claims — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Claims header — title, synthetic context and available actions; 3 Case tabs (12) — active Claims; tabs are navigation, not state changes; 4 Claims list — cluster text, linked source count and alignment state; generated relations are reported_by or uncertain. · frame 1 of 2; 5 Selected claim detail — frozen citation reference, effective relation and assessment provenance. · frame 1 of 2; 6 Claim actions — Inspect evidence opens the inspector; Open frozen citation opens the immutable citation reader. · frame 1 of 2; 7 Expanded claim detail — model-labelled Arbiter classification, rationale and recorded for/against/neutral party positions; consensus is not truth. · frame 1 of 2.</desc>
