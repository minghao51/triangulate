  <title id="wf-title">Search — no results — mobile</title>
  <desc id="wf-desc">Search — no results — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Search — no results header — title, synthetic context and available actions; 3 Filters remain visible — the applied query and filters are printed with the empty result. · frame 1 of 1; 4 No-results state — a valid empty result, not an unavailable index. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
