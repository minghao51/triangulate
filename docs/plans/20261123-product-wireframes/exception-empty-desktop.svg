  <title id="wf-title">Exception — none recorded — desktop</title>
  <desc id="wf-desc">Exception — none recorded — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Exception — none recorded header — title, synthetic context and available actions; 3 Empty queue — not a failed read and not an unavailable capability. · frame 1 of 1; 4 Interpretation note — an empty queue is a valid read, not a failure. · frame 1 of 1.</desc>
