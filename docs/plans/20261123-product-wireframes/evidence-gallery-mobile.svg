    <text x="296" y="56" text-anchor="middle" font-size="12" fill="#000">Menu</text>
    <rect x="16" y="104" width="328" height="80" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="144" font-size="14" fill="#000" font-weight="600">Evidence gallery</text>
    <text x="32" y="168" font-size="12" fill="#666">Provided extraction tier, not truth ·…</text>
    <rect x="16" y="208" width="328" height="56" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="232" font-size="14" fill="#000" font-weight="600">Evidence</text>
    <text x="32" y="256" font-size="12" fill="#666">12 tabs · tab strip scrolls horizontally</text>
    <g data-pane="p1">
    <rect x="16" y="288" width="328" height="232" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="32" y="320" font-size="12" fill="#000">Tier</text>
    <rect x="32" y="328" width="296" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="40" y="352" font-size="12" fill="#000">All</text>
    <text x="32" y="376" font-size="12" fill="#000">Captured</text>
    <rect x="32" y="384" width="296" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <text x="40" y="408" font-size="12" fill="#000">any</text>
    <text x="32" y="432" font-size="12" fill="#000">Publisher</text>
    <rect x="32" y="440" width="296" height="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
