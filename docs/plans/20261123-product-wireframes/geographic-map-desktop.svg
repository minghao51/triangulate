<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Geographic map — desktop</title>
  <desc id="wf-desc">Geographic map — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Geographic map header — title, synthetic context and available actions; 3 Case tabs (12) — active Map; tabs are navigation, not state changes; 4 Map area — placeholder X and geotagged markers; no map tiles are loaded or implied. · frame 1 of 1; 5 Event list — geotagged events only; untagged events are listed as unknown place. · frame 1 of 1; 6 Place data — untagged stays unknown; the map is a placeholder, not a live basemap. · frame 1 of 1.</desc>
