  <title id="wf-title">Inspector — quotation not in scope — mobile</title>
  <desc id="wf-desc">Inspector — quotation not in scope — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — all seven destinations remain reachable; CLI owns ingest; 2 Inspector — quotation not in scope header — title, synthetic context and available actions; 3 No-match state — no highlight and no scope widening on read. · frame 1 of 1; 4 Recorded scope — the reader does not search outside the recorded scope. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
