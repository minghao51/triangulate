  <title id="wf-title">Runs and changes — part 2 of 2 — tablet</title>
  <desc id="wf-desc">Runs and changes — part 2 of 2 — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Runs and changes — frame 2 of 2; full coverage continues in the named companion frame; 3 Typed before/after rows — review_state_changed carries the case review state, not a claim verification state. · frame 2 of 2; 4 Per-item run facts — origin run and observer run as separate recorded values; neither implies who caused a change. · frame 2 of 2; 5 Delta pagination — offset lives in the URL; the selected run stays pinned. · frame 2 of 2.</desc>
