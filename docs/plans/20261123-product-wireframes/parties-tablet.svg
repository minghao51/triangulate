<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Parties — tablet</title>
  <desc id="wf-desc">Parties — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Parties header — title, synthetic context and available actions; 3 Case tabs (12) — active Parties; tabs are navigation, not state changes; 4 Party table — recorded, inferred or confirmed basis; counts are recorded rows, never guessed stance. · frame 1 of 1; 5 Expanded party accordion — recorded/model position, concerns, priorities, supported/contested/unique claim counts and explicit unavailable fields. · frame 1 of 1; 6 Honesty rules — recorded/model party position only; missing data is shown, never invented. · frame 1 of 1.</desc>
