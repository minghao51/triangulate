  <title id="wf-title">Comparison — dependency warning — tablet</title>
  <desc id="wf-desc">Comparison — dependency warning — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Comparison — dependency warning header — title, synthetic context and available actions; 3 Dependency warning — reasons and limitation shown before the rows. · frame 1 of 1; 4 Rows under warning — alignment states remain extraction coverage, not endorsement. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
