<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Case overview — desktop</title>
  <desc id="wf-desc">Case overview — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Case overview header — title, synthetic context and available actions; 3 Case tabs (12) — active Overview; tabs are navigation, not state changes; 4 Observed counts — only observed rows; a failed read is unavailable, never zero. · frame 1 of 1; 5 Case status — review readiness, stage and automation; claim verification states are separate per claim. · frame 1 of 1; 6 Review decision — rationale plus Approve, Action Required or Reject; no extra decision dropdown. · frame 1 of 1.</desc>
