<!-- viewport: 375×812 mobile -->
<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Narratives — mobile</title>
  <desc id="wf-desc">Narratives — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Narratives header — title, synthetic context and available actions; 3 Persisted clusters — stored cluster rows with their claim counts; no stance is generated on read. · frame 1 of 1; 4 Cluster detail — member claims and shared terms; the reader never invents a narrative position. · frame 1 of 1; 5 Reader rule — persisted data only; empty is distinct from unavailable. · frame 1 of 1.</desc>
