<!-- viewport: 1280×800 desktop -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Narratives — desktop</title>
  <desc id="wf-desc">Narratives — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — global destinations only (Network, Sources and Narratives open inside a case); GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Narratives header — title, synthetic context and available actions; 3 Persisted clusters — stored cluster rows with their claim counts; no stance is generated on read. · frame 1 of 1; 4 Cluster detail — member claims and shared terms; the reader never invents a narrative position. · frame 1 of 1; 5 Reader rule — persisted data only; empty is distinct from unavailable. · frame 1 of 1.</desc>
