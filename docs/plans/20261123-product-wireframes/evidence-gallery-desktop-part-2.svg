  <title id="wf-title">Evidence gallery — part 2 of 2 — desktop</title>
  <desc id="wf-desc">Evidence gallery — part 2 of 2 — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Evidence gallery — frame 2 of 2; full coverage continues in the named companion frame; 3 Selected source pane — title, capture pointer, provided tier and stored verification metadata labelled model/legacy_unknown; never certified truth. · frame 2 of 2; 4 Selected-source actions — Inspect source, safe HTTP(S) Open source and Verification details. · frame 2 of 2; 5 Pagination — filter and page state is URL-persisted; no synthetic total. · frame 2 of 2.</desc>
