  <title id="wf-title">Changes — no snapshot published — tablet</title>
  <desc id="wf-desc">Changes — no snapshot published — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Changes — no snapshot published header — title, synthetic context and available actions; 3 Unavailable banner — failed or interrupted runs never advance the baseline. · frame 1 of 1; 4 Recorded error — the stored failure is shown; recovery stays CLI-only. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
