    <text x="48" y="256" font-size="14" fill="#000" font-weight="600">Capabilities</text>
    <text x="48" y="280" font-size="12" fill="#000" font-weight="600">Capability</text>
    <text x="296" y="280" font-size="12" fill="#000" font-weight="600">State</text>
    <text x="424" y="280" font-size="12" fill="#000" font-weight="600">Detail</text>
    <line x1="48" y1="288" x2="720" y2="288" stroke="#000" stroke-width="1.5"/>
    <text x="48" y="320" font-size="12" fill="#000">claim extraction</text>
    <text x="296" y="320" font-size="12" fill="#000">available</text>
    <text x="424" y="320" font-size="12" fill="#000">collector, recorded provenance</text>
    <text x="48" y="352" font-size="12" fill="#000">party classification</text>
    <text x="296" y="352" font-size="12" fill="#000">available</text>
    <text x="424" y="352" font-size="12" fill="#000">model-labelled</text>
