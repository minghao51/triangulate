<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">AI integration info — tablet</title>
  <desc id="wf-desc">AI integration info — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 AI integration info header — title, synthetic context and available actions; 3 Capabilities — available and unavailable features stated explicitly; no general chatbot. · frame 1 of 1; 4 Provenance note — model assessment origin stays visible and unknown origin stays unknown. · frame 1 of 1; 5 Unavailable features — listed rather than hidden. · frame 1 of 1.</desc>
