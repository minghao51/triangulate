    <text x="296" y="384" font-size="12" fill="#000">unavailable</text>
    <text x="424" y="384" font-size="12" fill="#000">no saved evaluation</text>
    <text x="48" y="416" font-size="12" fill="#000">chat</text>
    <text x="296" y="416" font-size="12" fill="#000">unavailable</text>
    <text x="424" y="416" font-size="12" fill="#000">no chat surface</text>
    </g>
    <g data-pane="p2">
