  <title id="wf-title">Capture inspector — part 2 of 3 — mobile</title>
  <desc id="wf-desc">Capture inspector — part 2 of 3 — mobile (mobile, 375x812). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (menu) — the four global destinations; case views open inside a case; CLI owns ingest; 2 Capture inspector — frame 2 of 3; full coverage continues in the named companion frame; 3 Synthetic passage block — grey box stands for captured text; labelled mock example, so no validated code-point range is claimed. · frame 2 of 3; 4 Capture version selector and Open source control — an actual field plus a safe HTTP(S) link control; both are visible, not prose only. · frame 2 of 3.</desc>
