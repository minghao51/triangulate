  <title id="wf-title">Timeline — desktop</title>
  <desc id="wf-desc">Timeline — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Timeline header — title, synthetic context and available actions; 3 Case tabs (12) — active Timeline; tabs are navigation, not state changes; 4 Timeline entries — each row shows a verification state; a missing timestamp is shown as unknown and never inferred. · frame 1 of 1; 5 Verification vocabulary — the six stored states; an unexpected raw value renders as 'Unrecognized status', and an unknown date stays distinct from the state. · frame 1 of 1.</desc>
