<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Narratives — tablet</title>
  <desc id="wf-desc">Narratives — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Narratives header — title, synthetic context and available actions; 3 Persisted clusters — stored cluster rows with their claim counts; no stance is generated on read. · frame 1 of 1; 4 Cluster detail — member claims and shared terms; the reader never invents a narrative position. · frame 1 of 1; 5 Reader rule — persisted data only; empty is distinct from unavailable. · frame 1 of 1.</desc>
