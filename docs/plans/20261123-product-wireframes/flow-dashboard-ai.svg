  <desc id="wf-desc">Dashboard, AI info, case and search flow — desktop flow (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Flow title — reading rule stated before any transition; order is navigation, not execution; 2 Thumbnail 1 — Dashboard — case portfolio (dashboard); geometry-derived miniature, source text omitted; 3 Transition 1 — 'capability': navigation/review path only; 4 Thumbnail 2 — AI integration info (ai-info); geometry-derived miniature, source text omitted; 5 Transition 2 — 'open case': navigation/review path only; 6 Thumbnail 3 — Case overview (case-overview); geometry-derived miniature, source text omitted; 7 Transition 3 — 'search': navigation/review path only; 8 Thumbnail 4 — Case search (search); geometry-derived miniature, source text omitted; 9 Legend — thumbnail abstraction and grid rules; no automatic transition is implied.</desc>
