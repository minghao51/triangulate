  <title id="wf-title">Runs and changes — tablet</title>
  <desc id="wf-desc">Runs and changes — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Runs and changes header — title, synthetic context and available actions; 3 Case tabs (12) — active Changes; tabs are navigation, not state changes; 4 Grouped run selector — an actual selector field listing run-0007 (run-0006 selectable), plus Refresh and Permalink; the selection is pinned in the URL. · frame 1 of 2; 5 Baseline and target snapshot ids with the coverage warning. · frame 1 of 2; 6 Run semantics — pending, failed and attribution rules stated next to the selector. · frame 1 of 2.</desc>
