  <title id="wf-title">Evidence — filter empty — desktop</title>
  <desc id="wf-desc">Evidence — filter empty — desktop (desktop, 1280x800). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation — GET reads only; ingest, rerun, rebuild and recovery stay CLI-only; 2 Evidence — filter empty header — title, synthetic context and available actions; 3 Active filters — the applied tier and capture filters that produced the empty result. · frame 1 of 1; 4 Filter-empty state — no rows match, which is not a case without sources. · frame 1 of 1; 5 State scope note — what the state does and does not assert. · frame 1 of 1.</desc>
