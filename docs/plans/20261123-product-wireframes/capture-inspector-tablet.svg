<!-- viewport: 768×1024 tablet -->
<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Capture inspector — tablet</title>
  <desc id="wf-desc">Capture inspector — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Capture inspector header — title, synthetic context and available actions; 3 Case tabs (12) — active Evidence; tabs are navigation, not state changes; 4 Claim and immutable citation — frozen claim text, relationship and model assessment provenance. · frame 1 of 2; 5 Capture metadata — publisher host, observation and recording times, hash, published-unavailable and recorded extraction scope. · frame 1 of 2; 6 Synthetic passage block — grey box stands for captured text; labelled mock example, so no validated code-point range is claimed. · frame 1 of 2; 7 Capture version selector and Open source control — an actual field plus a safe HTTP(S) link control; both are visible, not prose only. · frame 1 of 2.</desc>
