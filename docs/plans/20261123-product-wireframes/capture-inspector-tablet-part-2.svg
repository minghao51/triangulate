  <title id="wf-title">Capture inspector — part 2 of 2 — tablet</title>
  <desc id="wf-desc">Capture inspector — part 2 of 2 — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — global destinations only (case views open inside a case); GET reads only; CLI owns ingest and runs; 2 Capture inspector — frame 2 of 2; full coverage continues in the named companion frame; 3 Provenance — provisional publisher host, unknown independence and both source URLs. · frame 2 of 2; 4 Reader notes — quotation validation rules and the synthetic-passage limitation. · frame 2 of 2.</desc>
