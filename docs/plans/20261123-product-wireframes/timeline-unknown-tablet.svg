    <text x="48" y="456" font-size="14" fill="#000" font-weight="600">What this is not</text>
    <text x="48" y="480" font-size="12" fill="#666">Unknown date is distinct from verification state</text>
    <text x="48" y="504" font-size="12" fill="#666">Unexpected raw value renders as 'Unrecognized status'</text>
    <text x="48" y="528" font-size="12" fill="#666">No 1970 placeholder and no inferred ordering</text>
    </g>
