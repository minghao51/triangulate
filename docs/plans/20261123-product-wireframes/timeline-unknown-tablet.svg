<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">Timeline — unknown date and raw status — tablet</title>
  <desc id="wf-desc">Timeline — unknown date and raw status — tablet (tablet, 768x1024). Proposal wireframe with synthetic data, not implementation evidence. Numbered regions: 1 Primary navigation (top bar) — GET reads only; CLI owns ingest and runs; 2 Timeline — unknown date and raw status header — title, synthetic context and available actions; 3 Timeline with an unknown date and an unexpected raw status — both labelled explicitly. · frame 1 of 1; 4 State scope note — what the state does and does not assert. · frame 1 of 1; 5 Status keys — the six states plus the unrecognized-raw-value label. · frame 1 of 1.</desc>
